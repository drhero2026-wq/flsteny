<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليل وعي | فاحص المنتجات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary-text: #1f2937;
            --secondary-text: #6b7280;
            
            /* ألوان الحالات */
            --safe-color: #10b981;
            --safe-bg: #d1fae5;
            
            --boycott-color: #ef4444;
            --boycott-bg: #fee2e2;
            
            --unclear-color: #f59e0b;
            --unclear-bg: #fef3c7;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* رأس الصفحة */
        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: transparent;
            margin-bottom: 5px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-text);
            margin: 0;
            letter-spacing: -0.5px;
        }
        
        header p {
            font-size: 0.9rem;
            color: var(--secondary-text);
            margin: 5px 0 0 0;
        }

        /* حاوية الكاميرا */
        .scanner-wrapper {
            width: 90%;
            max-width: 400px;
            height: 280px; /* تقليل الارتفاع قليلاً لإفساح المجال للبحث اليدوي */
            background: #e5e7eb;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
            border: 4px solid white;
            margin-bottom: 20px;
        }

        #reader {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        #reader__scan_region { background: transparent !important; }
        #reader__dashboard_section_csr button { display: none !important; }

        .scan-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; height: 180px;
            border: 2px dashed rgba(255,255,255,0.8);
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .scan-hint {
            position: absolute;
            bottom: 10px; left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 0.8rem;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* === الجديد: قسم الإدخال اليدوي === */
        .manual-entry-container {
            width: 90%;
            max-width: 400px;
            display: flex;
            gap: 10px;
            background: white;
            padding: 8px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .input-code {
            flex: 1;
            border: none;
            padding: 10px 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            background: transparent;
            color: var(--primary-text);
        }
        
        .input-code::placeholder {
            color: #bdc3c7;
            font-size: 0.9rem;
        }

        .btn-search {
            background: var(--primary-text);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-search:active {
            transform: scale(0.95);
        }

        /* كارت النتيجة المنبثق */
        .result-modal {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            background: var(--card-bg);
            border-radius: 30px 30px 0 0;
            padding: 30px 20px 40px 20px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
